name: Regression and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static and version checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check source and release tools
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -m pip install -r tests/requirements.txt
          python -m unittest tests.test_release -v
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            python -m tests.static_checks --base "$BASE_SHA"
          else
            python -m tests.static_checks
          fi

  browser:
    name: Browser regression (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies and browser
        env:
          BROWSER: ${{ matrix.engine }}
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps "$BROWSER"
      - name: Run browser and local data tests
        env:
          BROWSER: ${{ matrix.engine }}
          UPGRADE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -m unittest tests.test_browser tests.test_storage tests.test_history -v

  gate:
    name: Release gate
    if: ${{ always() }}
    needs: [static, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require every check to pass
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          echo "Static checks: $STATIC_RESULT; browser matrix: $BROWSER_RESULT"
          test "$STATIC_RESULT" = success && test "$BROWSER_RESULT" = success

  verify-pages:
    name: Verify GitHub Pages and tag release
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    concurrency:
      group: dispatch-manager-pages-verification
      cancel-in-progress: false
    permissions:
      contents: write
      deployments: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Match the deployment and compare the public app files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.verify_pages
